[package]
name = "app"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
argon2 = "=0.6.0"
axum = { version = "=0.8.9", features = ["macros"] }
base64 = "=0.23.1"
hmac = "=0.13.0"
rand = "=0.10.3"
rusqlite = { version = "=0.41.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tokio = { version = "=1.54.1", features = ["full"] }
