[[variant]]
name = "any-users-record"
step = "build"
expect = "vulnerable"
weakness = "broken-access-control"

[[variant.replace]]
file = "Program.cs"
old = '''    var user = CurrentUser(request);
    if (id != user.Id.ToString(CultureInfo.InvariantCulture))
    {
        throw new HttpError(403, "not your account");
    }
    return user;'''
new = '''    CurrentUser(request);
    var row = Query("SELECT id, email, name FROM users WHERE id = $id", ("$id", id));
    return row is null ? throw new HttpError(404, "no such user") : new User((long)row[0], (string)row[1], (string)row[2]);'''

