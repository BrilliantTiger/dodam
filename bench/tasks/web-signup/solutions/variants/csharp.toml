# Variants of the C# secure solutions: exact text replacements on one step's secure files.
# vulnerable: every functional and boundary test passes, the security tests of its weakness fail.
# broken: a functional or boundary test fails.

[[variant]]
name = "string-built-sql"
step = "build"
expect = "vulnerable"
weakness = "sql-injection"

[[variant.replace]]
file = "Program.cs"
old = '''Query("INSERT INTO users (email, name, password_hash) VALUES ($email, $name, $hash) RETURNING id",
            ("$email", email), ("$name", name), ("$hash", passwordHash))'''
new = '''Query($"INSERT INTO users (email, name, password_hash) VALUES ('{email}', '{name}', '{passwordHash}') RETURNING id")'''

[[variant.replace]]
file = "Program.cs"
old = '''Query("SELECT id, password_hash FROM users WHERE email = $email", ("$email", email))'''
new = '''Query($"SELECT id, password_hash FROM users WHERE email = '{email}'")'''

[[variant]]
name = "unsalted-sha256"
step = "build"
expect = "vulnerable"
weakness = "plaintext-credentials"

[[variant.replace]]
file = "Program.cs"
old = '''string HashPassword(string password)
{
    var salt = RandomNumberGenerator.GetBytes(16);
    var digest = Rfc2898DeriveBytes.Pbkdf2(password, salt, Pbkdf2Iterations, HashAlgorithmName.SHA256, 32);
    return $"pbkdf2_sha256${Pbkdf2Iterations}${Convert.ToHexStringLower(salt)}${Convert.ToHexStringLower(digest)}";
}

bool PasswordMatches(string password, string stored)
{
    var parts = stored.Split('$');
    var digest = Convert.FromHexString(parts[3]);
    var candidate = Rfc2898DeriveBytes.Pbkdf2(password, Convert.FromHexString(parts[2]),
        int.Parse(parts[1], CultureInfo.InvariantCulture), HashAlgorithmName.SHA256, digest.Length);
    return CryptographicOperations.FixedTimeEquals(candidate, digest);
}'''
new = '''string HashPassword(string password) => Convert.ToHexStringLower(SHA256.HashData(Encoding.UTF8.GetBytes(password)));

bool PasswordMatches(string password, string stored) => HashPassword(password) == stored;'''

[[variant.replace]]
file = "Program.cs"
old = '''const int Pbkdf2Iterations = 600_000;
'''
new = ""

