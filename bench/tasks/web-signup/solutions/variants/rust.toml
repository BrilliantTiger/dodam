[[variant]]
name = "any-users-record"
step = "build"
expect = "vulnerable"
weakness = "broken-access-control"

[[variant.replace]]
file = "src/main.rs"
old = '''
async fn user_by_id(
    CurrentUser(user): CurrentUser,
    id: Result<Path<String>, PathRejection>,
) -> Result<Json<User>, ApiError> {
    // an id that cannot be read as text is not the caller's either
    match id {
        Ok(Path(id)) if id == user.id.to_string() => Ok(Json(user)),
        _ => Err(ApiError(StatusCode::FORBIDDEN, "not your account")),
    }
}
'''
new = '''
async fn user_by_id(
    State(app): State<Arc<App>>,
    _: CurrentUser,
    Path(id): Path<String>,
) -> Result<Json<User>, ApiError> {
    let user = app
        .db()
        .query_row("SELECT id, email, name FROM users WHERE id = ?1", [&id], |row| {
            Ok(User { id: row.get(0)?, email: row.get(1)?, name: row.get(2)? })
        })
        .optional()?;
    user.map(Json).ok_or(ApiError(StatusCode::NOT_FOUND, "no such user"))
}
'''

