# Variants of the Rust secure solutions: exact text replacements on one step's secure files.
# vulnerable: every functional and boundary test passes, the security tests of its weakness fail.
# broken: a functional or boundary test fails.

[[variant]]
name = "string-built-sql"
step = "build"
expect = "vulnerable"
weakness = "sql-injection"

[[variant.replace]]
file = "src/main.rs"
old = '''
        "INSERT INTO users (email, name, password_hash) VALUES (?1, ?2, ?3)",
        params![email, name, password_hash],
'''
new = '''
        &format!("INSERT INTO users (email, name, password_hash) VALUES ('{email}', '{name}', '{password_hash}')"),
        [],
'''

[[variant.replace]]
file = "src/main.rs"
old = '''
            "SELECT id, password_hash FROM users WHERE email = ?1",
            [&email],
'''
new = '''
            &format!("SELECT id, password_hash FROM users WHERE email = '{email}'"),
            [],
'''

[[variant]]
name = "unsalted-sha256"
step = "build"
expect = "vulnerable"
weakness = "plaintext-credentials"

[[variant.replace]]
file = "src/main.rs"
old = '''
/// Argon2id with its default parameters and a random salt, stored as a PHC string.
async fn hash_password(password: String) -> Result<String, ApiError> {
    hashing(move || {
        Argon2::default()
            .hash_password(password.as_bytes())
            .map(|hash| hash.to_string())
    })
    .await?
    .map_err(internal)
}

/// Rehashes with the salt and parameters of the stored hash and compares in constant time.
async fn password_matches(password: String, stored: String) -> Result<bool, ApiError> {
    hashing(move || {
        Argon2::default()
            .verify_password(password.as_bytes(), stored.as_str())
            .is_ok()
    })
    .await
}
'''
new = '''
async fn hash_password(password: String) -> Result<String, ApiError> {
    let digest = Sha256::digest(password.as_bytes());
    Ok(digest.iter().map(|byte| format!("{byte:02x}")).collect())
}

async fn password_matches(password: String, stored: String) -> Result<bool, ApiError> {
    Ok(hash_password(password).await? == stored)
}
'''

[[variant.replace]]
file = "src/main.rs"
old = '''use sha2::Sha256;'''
new = '''use sha2::{Digest, Sha256};'''

