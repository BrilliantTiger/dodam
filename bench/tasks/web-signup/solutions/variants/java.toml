[[variant]]
name = "any-users-record"
step = "build"
expect = "vulnerable"
weakness = "broken-access-control"

[[variant.replace]]
file = "src/main/java/app/App.java"
old = '''    User user = currentUser(headers);
    if (!id.equals(Long.toString(user.id()))) {
      throw new HttpError(HttpStatus.FORBIDDEN, "not your account");
    }
    return user;'''
new = '''    currentUser(headers);
    User user = first("SELECT id, email, name FROM users WHERE id = ?", User::from, id);
    if (user == null) {
      throw new HttpError(HttpStatus.NOT_FOUND, "no such user");
    }
    return user;'''

