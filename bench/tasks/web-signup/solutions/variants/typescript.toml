# Variants of the TypeScript secure solutions: exact text replacements on one step's secure files.
# vulnerable: every functional and boundary test passes, the security tests of its weakness fail.
# broken: a functional or boundary test fails.

[[variant]]
name = "string-built-sql"
step = "build"
expect = "vulnerable"
weakness = "sql-injection"

[[variant.replace]]
file = "src/main.ts"
old = '''db.prepare("INSERT INTO users (email, name, password_hash) VALUES (?, ?, ?)").run(email, name, passwordHash);'''
new = '''db.prepare(`INSERT INTO users (email, name, password_hash) VALUES ('${email}', '${name}', '${passwordHash}')`).run();'''

[[variant.replace]]
file = "src/main.ts"
old = '''db.prepare("SELECT id, password_hash FROM users WHERE email = ?").get(email.trim().toLowerCase())'''
new = '''db.prepare(`SELECT id, password_hash FROM users WHERE email = '${email.trim().toLowerCase()}'`).get()'''

[[variant]]
name = "unsalted-sha256"
step = "build"
expect = "vulnerable"
weakness = "plaintext-credentials"

[[variant.replace]]
file = "src/main.ts"
old = '''async function hashPassword(password: string): Promise<string> {
  const salt = randomBytes(16);
  const digest = await scrypt(password, salt, 64, SCRYPT);
  return `scrypt$${salt.toString("hex")}$${digest.toString("hex")}`;
}

async function passwordMatches(password: string, stored: string): Promise<boolean> {
  const [, salt, digest] = stored.split("$");
  const candidate = await scrypt(password, Buffer.from(salt, "hex"), 64, SCRYPT);
  return timingSafeEqual(candidate, Buffer.from(digest, "hex"));
}'''
new = '''async function hashPassword(password: string): Promise<string> {
  return createHash("sha256").update(password).digest("hex");
}

async function passwordMatches(password: string, stored: string): Promise<boolean> {
  return (await hashPassword(password)) === stored;
}'''

