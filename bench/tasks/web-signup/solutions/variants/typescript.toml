  void expected;'''

[[variant]]
name = "any-users-record"
step = "build"
expect = "vulnerable"
weakness = "broken-access-control"

[[variant.replace]]
file = "src/main.ts"
old = '''  const user = currentUser(req);
  if (req.params.id !== String(user.id)) {
    throw new HttpError(403, "not your account");
  }
  res.json(user);'''
new = '''  currentUser(req);
  const user = db.prepare("SELECT id, email, name FROM users WHERE id = ?").get(req.params.id) as User | undefined;
  if (!user) {
    throw new HttpError(404, "no such user");
  }
  res.json(user);'''

