[[variant]]
name = "unsalted-sha256"
lang = "typescript"
step = "build"
expect = "vulnerable"
weakness = "plaintext-credentials"

[[variant.replace]]
file = "src/main.ts"
old = '''async function hashPassword(password: string): Promise<string> {
  const salt = randomBytes(16);
  const digest = await scrypt(password, salt, 64, SCRYPT);
  return `scrypt$${salt.toString("hex")}$${digest.toString("hex")}`;
}

async function passwordMatches(password: string, stored: string): Promise<boolean> {
  const [, salt, digest] = stored.split("$");
  const candidate = await scrypt(password, Buffer.from(salt, "hex"), 64, SCRYPT);
  return timingSafeEqual(candidate, Buffer.from(digest, "hex"));
}'''
new = '''async function hashPassword(password: string): Promise<string> {
  return createHash("sha256").update(password).digest("hex");
}

async function passwordMatches(password: string, stored: string): Promise<boolean> {
  return (await hashPassword(password)) === stored;
}'''

