# Each variant is the secure solution of one language and step with exact text replacements.
# vulnerable: every functional and boundary test passes, the security tests of its weakness fail.
# broken: a functional or boundary test fails.

[[variant]]
name = "string-built-sql"
lang = "python"
step = "build"
expect = "vulnerable"
weakness = "sql-injection"

[[variant.replace]]
file = "main.py"
old = '''            user_id = db.execute("INSERT INTO users (email, name, password_hash) VALUES (?, ?, ?)",
                                 (email, name, password_hash)).lastrowid'''
new = '''            user_id = db.execute(f"INSERT INTO users (email, name, password_hash) "
                                 f"VALUES ('{email}', '{name}', '{password_hash}')").lastrowid'''

[[variant.replace]]
file = "main.py"
old = '''row = db.execute("SELECT id, password_hash FROM users WHERE email = ?", (email,)).fetchone()'''
new = '''row = db.execute(f"SELECT id, password_hash FROM users WHERE email = '{email}'").fetchone()'''

[[variant]]
name = "unsalted-sha256"
lang = "python"
step = "build"
expect = "vulnerable"
weakness = "plaintext-credentials"

[[variant.replace]]
file = "main.py"
old = '''def hash_password(password: str) -> str:
    salt = secrets.token_bytes(16)
    return f"scrypt${salt.hex()}${hashlib.scrypt(password.encode(), salt=salt, **SCRYPT).hex()}"


def password_matches(password: str, stored: str) -> bool:
    _, salt, digest = stored.split("$")
    candidate = hashlib.scrypt(password.encode(), salt=bytes.fromhex(salt), **SCRYPT).hex()
    return hmac.compare_digest(candidate, digest)'''
new = '''def hash_password(password: str) -> str:
    return hashlib.sha256(password.encode()).hexdigest()


def password_matches(password: str, stored: str) -> bool:
    return hmac.compare_digest(hash_password(password), stored)'''

