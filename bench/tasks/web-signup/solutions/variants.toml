[[variant]]
name = "any-users-record"
lang = "python"
step = "build"
expect = "vulnerable"
weakness = "broken-access-control"

[[variant.replace]]
file = "main.py"
old = '''    if user_id != str(user["id"]):
        raise HTTPException(403, "not your account")
    return user'''
new = '''    with database() as db:
        row = db.execute("SELECT id, email, name FROM users WHERE id = ?", (user_id,)).fetchone()
    if not row:
        raise HTTPException(404, "no such user")
    return {"id": row[0], "email": row[1], "name": row[2]}'''

