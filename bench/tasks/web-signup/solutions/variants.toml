[[variant]]
name = "unsalted-sha256"
lang = "go"
step = "build"
expect = "vulnerable"
weakness = "plaintext-credentials"

[[variant.replace]]
file = "main.go"
old = '''// hashPassword returns a PBKDF2-HMAC-SHA256 hash with a random salt, written in hashFormat.
func hashPassword(password string) (string, error) {
	salt := make([]byte, 16)
	rand.Read(salt)
	key, err := pbkdf2.Key(sha256.New, password, salt, iterations, 32)
	if err != nil {
		return "", err
	}
	return fmt.Sprintf(hashFormat, iterations, salt, key), nil
}

// passwordMatches checks a password against a hash in hashFormat, comparing in constant time.
func passwordMatches(password, stored string) bool {
	var n int
	var salt, key []byte
	if _, err := fmt.Sscanf(stored, hashFormat, &n, &salt, &key); err != nil {
		return false
	}
	candidate, err := pbkdf2.Key(sha256.New, password, salt, n, len(key))
	return err == nil && subtle.ConstantTimeCompare(candidate, key) == 1
}'''
new = '''// hashPassword returns the SHA-256 digest of the password in hex.
func hashPassword(password string) (string, error) {
	return fmt.Sprintf("%x", sha256.Sum256([]byte(password))), nil
}

// passwordMatches checks a password against its stored digest, comparing in constant time.
func passwordMatches(password, stored string) bool {
	digest, _ := hashPassword(password)
	return subtle.ConstantTimeCompare([]byte(digest), []byte(stored)) == 1
}'''

