[[attack]]
class = "memory"
name = "holding on to the kernel's records of names and files"
tries = "the program makes the kernel keep records that it cannot give back while the program holds on to what they describe: open files, memory files that are mapped and closed, shared mappings without a file, the image's files mapped, far-apart pages in the case folder; or it asks for 400,000 names that are not there"
must = "at most a quarter of the case's memory limit and never more than 16 MB of such records are left out of the case's memory; what goes beyond counts, and a program that holds more than its limit and that amount fails for memory"
tests = [
    "tests/test_cli_isolation.py::test_what_a_case_holds_beyond_what_the_judge_counts_stays_within_the_amount_left_out",
    "tests/test_cli_isolation.py::test_a_program_that_looks_at_files_is_free_up_to_the_amount_left_out_and_pays_beyond_it",
]

[[attack]]
class = "memory"
name = "locking pages of files in memory"
tries = "the program, alone or with many processes, locks pages in memory: a range, everything it has, a mapping asked for as locked, shared memory; a locked page of a file cannot be given back by the kernel"
must = "nothing of the program's side, in the build or in a run, can lock memory; and a page of a file that stands on neither of the kernel's two lists counts as memory whatever keeps it off them"
tests = [
    "tests/test_cli_isolation.py::test_no_memory_can_be_locked_and_no_page_handed_to_the_kernel_by_the_build_or_by_a_run",
    "tests/test_cli_isolation.py::test_pages_of_a_file_locked_by_many_processes_are_within_the_bound_or_fail_the_case",
    "tests/test_cli_judge.py::test_a_page_of_a_file_on_neither_of_the_kernels_two_lists_is_counted_as_memory",
]

[[attack]]
class = "memory"
name = "handing pages of files to pipes and sockets"
tries = "the program hands pages of a file to the kernel without copying them: a file spliced into pipes, a mapped file given to pipes, a file sent into local sockets and into network sockets; or it registers memory and files for asynchronous work, or uses the kernel's cryptography sockets"
