# The attacks the judging of command-line programs is measured against.
#
# This list is written before candidates are compared: a design is chosen by what it stops on this
# list, how long a case takes and whether repeated judging agrees. Every attack is also a test, and
# a test checks that each entry names one. "The program's side" is everything the agent's work can
# make run: the build and what the build starts, as well as the program.

[[attack]]
class = "learning the judging"
name = "the build reads the tests"
tries = "the build copies the tests folder into the program's folder and looks for the marker every hidden test carries"
must = "the build sees no file of the tests, the results or the judge"
tests = [
    "tests/test_cli_isolation.py::test_the_build_is_held_as_the_program_is",
    "tests/test_web_isolation.py::test_neither_the_build_nor_the_served_program_can_read_the_tests",
]

[[attack]]
class = "learning the judging"
name = "the program reads the tests"
tries = "the program walks the tests folder and reads every file"
must = "nothing is listed and nothing is read"
tests = [
    "tests/test_cli_isolation.py::test_the_program_cannot_read_the_tests_or_the_judges_settings",
    "tests/test_web_isolation.py::test_neither_the_build_nor_the_served_program_can_read_the_tests",
]

[[attack]]
class = "learning the judging"
name = "the program reads the process list"
tries = "the program reads the command line of every process in the container"
must = "no command line names a test, a report, a step or a folder of the judge"
tests = [
    "tests/test_cli_isolation.py::test_the_program_learns_nothing_about_the_judging",
    "tests/test_web_isolation.py::test_the_served_program_learns_nothing_about_the_test_being_run",
    "tests/test_cli_isolation.py::test_the_build_is_held_as_the_program_is",
]

[[attack]]
class = "learning the judging"
name = "the program reads the judge's processes"
tries = "the program reads the environment, the working folder and the open files of every other process"
must = "none is readable"
tests = [
    "tests/test_cli_isolation.py::test_the_program_cannot_read_the_tests_or_the_judges_settings",
]

[[attack]]
class = "learning the judging"
name = "the program reads its own environment"
tries = "the program looks for anything of the judge's in its environment"
must = "nothing of the judge's is there"
tests = [
    "tests/test_cli_isolation.py::test_the_program_learns_nothing_about_the_judging",
]

[[attack]]
class = "changing the result"
name = "the program writes the result"
tries = "the program writes, replaces, removes the result file, renames its folder and plants a link where it goes"
must = "every attempt is refused and the judge's result stands"
tests = [
    "tests/test_cli_isolation.py::test_the_program_cannot_write_replace_or_remove_the_result",
]

[[attack]]
class = "gaining rights"
name = "the program becomes root or the build's user"
tries = "setuid(0), su, su to the build's user, and a rights-lending file the build prepared"
must = "every attempt is refused"
tests = [
    "tests/test_cli_isolation.py::test_the_program_runs_as_an_ordinary_user_who_cannot_become_root",
    "tests/test_cli_isolation.py::test_a_build_cannot_prepare_the_ground_for_the_program",
]

[[attack]]
class = "gaining rights"
name = "the judge runs the program as root"
tries = "the judge is started as root without a user to run the program as, with and without asking for no separation"
must = "the judge refuses and runs nothing"
tests = [
    "tests/test_cli_isolation.py::test_root_never_judges_without_separation",
]

[[attack]]
class = "reaching out"
name = "the program uses the network"
tries = "the program connects to an address outside and looks a name up"
must = "both fail"
tests = [
    "tests/test_cli_isolation.py::test_the_program_has_no_network",
]

[[attack]]
class = "ending or outlasting the judge"
name = "the program kills what it can"
tries = "the program signals process 1, its parent and every process"
must = "it reaches none of them and the judge goes on"
tests = [
    "tests/test_cli_isolation.py::test_what_is_capped_cannot_be_taken_and_nothing_is_left_of_the_attempt[kills everything it can]",
]

[[attack]]
class = "ending or outlasting the judge"
name = "the program hangs"
tries = "the program ignores every signal and sleeps"
must = "it is ended at the time limit and its case fails"
tests = [
    "tests/test_cli_isolation.py::test_a_program_that_breaks_a_limit_fails_that_case_only_and_never_the_judge[ignores every signal and hangs]",
]

[[attack]]
class = "ending or outlasting the judge"
name = "the program leaves a process behind"
tries = "the program leaves a daemon in a session of its own and ends"
must = "the case fails and the daemon is gone before the next case"
tests = [
    "tests/test_cli_isolation.py::test_a_program_that_breaks_a_limit_fails_that_case_only_and_never_the_judge[leaves a daemon in a session of its own]",
]

[[attack]]
class = "ending or outlasting the judge"
name = "the build leaves a process behind"
tries = "the build starts a process in a session of its own"
must = "it is gone before the first case"
tests = [
    "tests/test_cli_isolation.py::test_a_build_cannot_prepare_the_ground_for_the_program",
]

[[attack]]
class = "memory"
name = "memory in one process"
tries = "one process takes memory as fast as it can"
must = "it is ended above the limit by the judge's measuring, before the kernel has to, and its case fails"
tests = [
    "tests/test_cli_isolation.py::test_a_program_that_breaks_a_limit_fails_that_case_only_and_never_the_judge[memory]",
]

[[attack]]
class = "memory"
name = "memory spread over processes"
tries = "eight processes take 64 MB each"
must = "as above"
tests = [
    "tests/test_cli_isolation.py::test_a_program_that_breaks_a_limit_fails_that_case_only_and_never_the_judge[memory in many processes]",
]

[[attack]]
class = "memory"
name = "memory in a memory file"
tries = "a memory file is filled and never mapped, so no process holds it"
must = "as above: the memory is counted although it is in no process"
tests = [
    "tests/test_cli_isolation.py::test_a_program_that_breaks_a_limit_fails_that_case_only_and_never_the_judge[memory in memory files that are never mapped]",
]

[[attack]]
class = "memory"
name = "memory that outlives its processes"
tries = "System V shared memory of 320 MB, a System V message queue and semaphores, a POSIX message queue, a file in the shared memory folder"
must = "none can be made"
tests = [
    "tests/test_cli_isolation.py::test_what_is_capped_cannot_be_taken_and_nothing_is_left_of_the_attempt[memory that would outlive its processes]",
    "tests/test_cli_isolation.py::test_nothing_one_case_leaves_reaches_the_next",
]

[[attack]]
class = "memory"
name = "more memory than the container has"
tries = "the case's limit is set above the container's cap and the program takes memory until the kernel steps in"
must = "the kernel ends the program and not the judge, the case fails for memory, the next case passes"
tests = [
    "tests/test_cli_isolation.py::test_a_program_that_breaks_a_limit_fails_that_case_only_and_never_the_judge[more memory than the whole container has]",
    "tests/test_cli_isolation.py::test_the_kernel_holds_the_program_to_its_limits",
]

[[attack]]
class = "memory"
name = "the build eats memory"
tries = "the build takes more memory than the container has"
must = "the kernel ends the build and not the judge; the build has failed"
tests = [
    "tests/test_cli_isolation.py::test_a_build_that_misbehaves_never_takes_the_judge_down",
]

[[attack]]
class = "memory"
name = "the build prints without end"
tries = "the build prints 400 MB"
must = "the judge keeps only the end of it"
tests = [
    "tests/test_cli_isolation.py::test_a_build_that_misbehaves_never_takes_the_judge_down",
]

[[attack]]
class = "files"
name = "one file past the size a file may have"
tries = "a file is made larger than the limit"
must = "the kernel refuses it and the case fails"
tests = [
    "tests/test_cli_isolation.py::test_a_program_that_breaks_a_limit_fails_that_case_only_and_never_the_judge[one file past the size a file may have]",
]

[[attack]]
class = "files"
name = "a sparse file"
tries = "a file of 10 GB that takes no space"
must = "no file can be made larger than the limit, sparse or not"
tests = [
    "tests/test_cli_isolation.py::test_what_is_capped_cannot_be_taken_and_nothing_is_left_of_the_attempt[a sparse file larger than a file may be]",
]

[[attack]]
class = "files"
name = "many files"
tries = "files of 1 MB without end"
must = "no more than the limit can be written"
tests = [
    "tests/test_cli_isolation.py::test_what_is_capped_cannot_be_taken_and_nothing_is_left_of_the_attempt[many files]",
]

[[attack]]
class = "files"
name = "files in the home and temporary folders"
tries = "files of 1 MB without end in the case's home and temporary folder"
must = "no more than the limit can be written in all of them together"
tests = [
    "tests/test_cli_isolation.py::test_what_is_capped_cannot_be_taken_and_nothing_is_left_of_the_attempt[files in its home and temporary folder]",
]

[[attack]]
class = "files"
name = "files deleted while open"
tries = "240 MB in eight files that are deleted while they are open, so no folder lists them"
must = "no more than the limit can be written"
tests = [
    "tests/test_cli_isolation.py::test_what_is_capped_cannot_be_taken_and_nothing_is_left_of_the_attempt[files deleted while they are open]",
]

[[attack]]
class = "files"
name = "files below a deep chain of folders"
tries = "1,100 folders inside each other and 240 MB below them"
must = "no more than the limit can be written, and the folders are removed"
tests = [
    "tests/test_cli_isolation.py::test_what_is_capped_cannot_be_taken_and_nothing_is_left_of_the_attempt[1,100 folders inside each other with files below]",
]

[[attack]]
class = "files"
name = "countless empty files"
tries = "empty files without end"
must = "no more entries than the cap can be made"
tests = [
    "tests/test_cli_isolation.py::test_what_is_capped_cannot_be_taken_and_nothing_is_left_of_the_attempt[countless empty files]",
]

[[attack]]
class = "files"
name = "files outside the case's folder"
tries = "the program tries every place a user may usually write"
must = "only the case's own folders are writable"
tests = [
    "tests/test_cli_isolation.py::test_the_program_can_write_nowhere_but_in_its_own_case",
    "tests/test_cli_isolation.py::test_nothing_one_case_leaves_reaches_the_next",
]

[[attack]]
class = "processes"
name = "fork without end"
tries = "every process forks without end"
must = "no more than the limit exist; the case ends at its time limit and fails"
tests = [
    "tests/test_cli_isolation.py::test_a_program_that_breaks_a_limit_fails_that_case_only_and_never_the_judge[fork without end]",
    "tests/test_cli_isolation.py::test_what_is_capped_cannot_be_taken_and_nothing_is_left_of_the_attempt[processes until no more can be made]",
]

[[attack]]
class = "processes"
name = "threads without end"
tries = "threads without end"
must = "no more than the limit exist"
tests = [
    "tests/test_cli_isolation.py::test_a_program_that_breaks_a_limit_fails_that_case_only_and_never_the_judge[threads without end]",
    "tests/test_cli_isolation.py::test_what_is_capped_cannot_be_taken_and_nothing_is_left_of_the_attempt[threads until no more can be made]",
]

[[attack]]
class = "processes"
name = "the build forks without end"
tries = "the build forks without end"
must = "the container's cap holds; the judge ends the build at its time limit and delivers a result"
tests = [
    "tests/test_cli_isolation.py::test_a_build_that_misbehaves_never_takes_the_judge_down",
]

[[attack]]
class = "output"
name = "flood of output"
tries = "the program writes without end"
must = "the judge stops reading at the limit, ends the program, and the case fails"
tests = [
    "tests/test_cli_isolation.py::test_a_program_that_breaks_a_limit_fails_that_case_only_and_never_the_judge[flood of output]",
]

[[attack]]
class = "the judge's own clean-up"
name = "what resists removal"
tries = "a deep chain of folders, closed folders, a named pipe, links to the tests and to everything, names with a line break and bytes that are no text"
must = "everything is removed, no link is followed, and the next case starts empty"
tests = [
    "tests/test_cli_isolation.py::test_what_is_capped_cannot_be_taken_and_nothing_is_left_of_the_attempt[folders and names that resist removal]",
    "tests/test_cli_isolation.py::test_what_is_capped_cannot_be_taken_and_nothing_is_left_of_the_attempt[1,100 folders inside each other with files below]",
    "tests/test_cli_judge.py::test_removing_what_a_case_left_follows_no_link_and_needs_no_depth",
]

[[attack]]
class = "the judge's own clean-up"
name = "what cannot be removed"
tries = "removing the case's folder fails"
must = "that case fails; it is no fault of the judge and the other cases are judged"
tests = [
    "tests/test_cli_judge.py::test_a_case_whose_folder_cannot_be_removed_fails_and_is_no_fault_of_the_judge",
]

[[attack]]
class = "leaving things for a later case"
name = "files, kernel objects and processes"
tries = "a marker file in every place it can write, shared memory, a message queue, a process"
must = "the next case finds none"
tests = [
    "tests/test_cli_isolation.py::test_nothing_one_case_leaves_reaches_the_next",
]

[[attack]]
class = "leaving things for a later case"
name = "the build prepares the ground"
tries = "the build leaves writable folders and a rights-lending file"
must = "none is usable by the program"
tests = [
    "tests/test_cli_isolation.py::test_a_build_cannot_prepare_the_ground_for_the_program",
]

[[attack]]
class = "passing as unjudged"
name = "a limit broken before a skip"
tries = "the program hangs in the feature a security test needs first"
must = "the case fails; it is not left unjudged"
tests = [
    "tests/test_cli_isolation.py::test_a_limit_broken_before_a_security_test_is_left_unjudged_fails_the_case",
]

[[attack]]
class = "passing as unjudged"
name = "an unjudged check read as a pass"
tries = "a security test is left unjudged"
must = "the security pass rate counts it as not passed"
tests = [
    "tests/test_cli_judge.py::test_a_check_that_was_not_judged_never_reads_as_passed",
]

[[attack]]
class = "a container without bounds"
name = "a missing cap"
tries = "the judge is started in a container with no process cap, with no capped folder for the cases, or with a memory cap above the machine's memory"
must = "the judge refuses with a diagnostic that is JSON first and runs nothing"
tests = [
    "tests/test_cli_isolation.py::test_the_judge_refuses_a_container_whose_caps_are_missing_or_cannot_hold",
]

[[attack]]
class = "a fault of the judge"
name = "the judge cannot do its work"
tries = "the judge's own tool breaks during a test"
must = "no result is written and the judge ends with its own exit code"
tests = [
    "tests/test_cli_isolation.py::test_a_fault_of_the_judge_in_the_container_leaves_no_result",
]
