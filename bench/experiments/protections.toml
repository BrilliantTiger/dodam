# Every protection of the judging, with one broken variant of the code and the test that must then fail.
#
# `python experiments/check_protections.py` makes each variant in a copy of this folder, runs the named
# tests there and fails when a variant leaves them all passing: then nothing pins that protection. A
# test also checks that the protections the document names and the ones listed here are the same.
#
# An entry with `second_line` is a second line of defence: other protections already stop the attack, and
# the entry says which. Its tests are attacks; the check sees that they still fail to get anything with
# the variant in place, and fails when one of them does not pass.
#
# One entry is one place of the code. The text a variant takes out occurs exactly once in its file; the
# check refuses an entry whose text occurs twice or not at all. A protection that sits in two places is
# two entries.

