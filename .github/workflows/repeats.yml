# The two honest cases of the attacks job, ten times over in each job, at the mended head and at the head
# before it, in turn. It lives on a branch of its own that is never merged. See repeats/repeat.py.
name: repeats

on:
  push:
    branches: [judge-memory-breaks]

permissions:
  contents: read

concurrency:
  group: breaks
  cancel-in-progress: false

jobs:
  keys:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      keys: ${{ steps.keys.outputs.keys }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: keys
        run: python3 repeats/repeat.py keys >> "$GITHUB_OUTPUT"

  repeat:
    needs: keys
    name: ${{ matrix.key }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        key: ${{ fromJSON(needs.keys.outputs.keys) }}
    env:
      KEY: ${{ matrix.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: side
      - id: tree
        run: python3 side/repeats/repeat.py ref "$KEY" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.tree.outputs.ref }}
          path: repo
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the judge's pinned packages
        working-directory: repo/bench
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r images/judge/requirements.txt
      - name: Build the Python language image
        working-directory: repo/bench/images
        run: docker build --quiet -f python/Dockerfile -t dodam-bench/python:dev .
      - name: Run the two tests ten times
        run: python side/repeats/repeat.py run repo
