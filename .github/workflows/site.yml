# Checks the introduction page in a real browser: the four languages are built from the template,
# and the layout holds at every width from 320 to 1100 px, at phone and foldable sizes, with large
# text, and when the page is folded and unfolded. The page's section about talking with the
# project's AI in real time reads differently for a way that is open and one that is not yet, so the layout
# is checked in all three states: with no way open, with the one on GitHub open, and with both open. Needs no secrets and only reads the repository.
name: site

# It runs on every push and pull request, with no path filter, so that it can be a required check.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the pinned browser driver
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/site/requirements.txt
      - name: The committed pages are what the template builds
        run: python tools/site/build.py --check
      - name: Build what would be published, with a made-up status that carries markup in a title
        run: python tools/site/build.py --live "$RUNNER_TEMP/site" --status tools/site/sample_status.json
      - name: Lay the page out at every size with the question about measurement open, and check that it asks first
        run: python tools/site/sweep.py --site "$RUNNER_TEMP/site" --consent
      - name: Build it again as it would be without a measurement ID
        run: python tools/site/build.py --live "$RUNNER_TEMP/unmeasured" --status tools/site/sample_status.json --analytics ""
      - name: Lay that out as well, and check that it asks no other host for anything
        run: python tools/site/sweep.py --quick --site "$RUNNER_TEMP/unmeasured"

  # The same check with a way to the desk open. The facts of the desk are the real ones; only the opening
  # dates and the measured times are made up, because no way is open yet. It runs beside the job above so
  # that neither comes near its time limit.
  desk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the pinned browser driver
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/site/requirements.txt
      - name: Build what would be published with the way on GitHub open
        run: python tools/site/build.py --live "$RUNNER_TEMP/github" --status tools/site/sample_status.json --open github
      - name: Lay that out at every size
        run: python tools/site/sweep.py --site "$RUNNER_TEMP/github" --desk github
      - name: Build it again with both ways open
        run: python tools/site/build.py --live "$RUNNER_TEMP/both" --status tools/site/sample_status.json --open github,live
      - name: Lay that out at every size
        run: python tools/site/sweep.py --site "$RUNNER_TEMP/both" --desk github,live
