# Runs the benchmark tool's tests on every push to any branch and on every pull request.
# Pull requests from forks get a read-only token and no secrets, and this workflow needs neither.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the judge's pinned packages
        working-directory: bench
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r images/judge/requirements.txt
      - name: Install the pinned Harbor
        working-directory: bench
        run: |
          python -m venv .harbor-venv
          .harbor-venv/bin/python -m pip install --quiet --require-hashes --only-binary=:all: -r harbor/requirements.txt
      - name: Check that the leak test catches the released Harbor
        working-directory: bench
        run: |
          set +e
          out=$(python -m pytest -q -p no:cacheprovider "tests/test_harbor_patch.py::test_harbor_passes_exec_variables_by_name_and_keeps_their_values_off_the_command_line" 2>&1)
          code=$?
          set -e
          if [ "$code" -ne 1 ] || ! printf '%s' "$out" | grep -q "DODAM_PROBE_SECRET_VALUE=sk-ant-oat01-PROBE"; then
            printf '%s\n' "$out"
            echo "The leak test did not find the made-up secret on the command line of the released Harbor."
            exit 1
          fi
          echo "As expected, the leak test fails on the released Harbor: the made-up secret is on the command line."
      - name: Apply Dodam's patch to Harbor
        working-directory: bench
        run: python -m dodambench.harbor_patch apply
      - name: Run the tests
        working-directory: bench
        run: python -m pytest -q -p no:cacheprovider
