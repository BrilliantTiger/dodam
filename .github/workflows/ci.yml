# Runs the benchmark tool's tests on every push to any branch and on every pull request.
# Pull requests from forks get a read-only token and no secrets, and this workflow needs neither.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The check that breaks the pilot's files once per test runs in the job "variants", beside the other tests.
env:
  DODAM_PILOT_VARIANTS: skip

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the judge's pinned packages
        working-directory: bench
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r images/judge/requirements.txt
      - name: Install the pinned Harbor
        working-directory: bench
        run: |
          python -m venv .harbor-venv
          .harbor-venv/bin/python -m pip install --quiet --require-hashes --only-binary=:all: -r harbor/requirements.txt
      - name: Check that the leak test catches the released Harbor
        working-directory: bench
        run: |
          set +e
          out=$(python -m pytest -q -p no:cacheprovider "tests/test_harbor_patch.py::test_a_listed_credential_stays_off_the_command_line_and_reaches_the_docker_cli_environment" 2>&1)
          code=$?
          set -e
          if [ "$code" -ne 1 ] || ! printf '%s' "$out" | grep -q "CLAUDE_CODE_OAUTH_TOKEN=sk-ant-oat01-PROBE"; then
            printf '%s\n' "$out"
            echo "The leak test did not find the made-up secret on the command line of the released Harbor."
            exit 1
          fi
          echo "As expected, the leak test fails on the released Harbor: the made-up secret is on the command line."
      - name: Apply Dodam's patch to Harbor
        working-directory: bench
        run: python -m dodambench.harbor_patch apply
      # The tests that judge inside a container are skipped here, where the image is not built; the
      # job below runs them. The desk's own tests run in the job "desk" of the workflow "site", so that
      # this job stays inside half of its limit; for the same reason the tests of the command-line judge
      # run in a second process beside the others, and the step fails where either fails.
      - name: Run the tests
        working-directory: bench
        run: |
          python -m pytest -q -p no:cacheprovider tests/test_cli_judge.py > cli-judge-tests.log 2>&1 &
          judge=$!
          set +e
          python -m pytest -q -p no:cacheprovider --ignore=tests/test_gemini.py --ignore=tests/test_desk.py --ignore=tests/test_desk_lock.py --ignore=tests/test_cli_judge.py
          rest=$?
          wait "$judge"
          judged=$?
          echo "--- the tests of the command-line judge"
          cat cli-judge-tests.log
          [ "$rest" -eq 0 ] && [ "$judged" -eq 0 ]

  # For every test about the pilot, one broken variant of the files; each test must fail on its variant.
  # It needs only the test runner, and it runs beside the job above so that neither comes near its time limit.
  # The checks on the Gemini job (tools/gemini) run here as well: they need only the test runner and git. Measured
  # on 19 November 2026: in the job above, when they all failed before the job existed, that job took 7 minutes
  # 29 seconds of its 15; here, passing, 103 of them took 32 seconds and this whole job 2 minutes 18 seconds.
  variants:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DODAM_PILOT_VARIANTS: run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the judge's pinned packages
        working-directory: bench
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r images/judge/requirements.txt
      - name: Check that every pilot test fails on its broken variant
        working-directory: bench
        run: |
          out=$(python -m pytest -q -p no:cacheprovider -rs tests/test_pilot_variants.py 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          if printf '%s' "$out" | grep -q "skipped"; then
            echo "A part of the variants check was skipped in the job that is there to run it."
            exit 1
          fi
      - name: Run the checks on the Gemini job
        working-directory: bench
        run: python -m pytest -q -p no:cacheprovider tests/test_gemini.py

  # The estimates' recorded outputs, worked out again in full: every seed and every case, not only the first
  # seed that the tests recompute. The scripts use the standard library only.
  recorded:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Each check is spread over machines so that every job ends well inside half of its limit.
        check:
          - pilot_replan.py --check --part schedule
          - pilot_replan.py --check --part forecast
          - claude_only.py --check --part 1/3
          - claude_only.py --check --part 2/3
          - claude_only.py --check --part 3/3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Check that the recorded output is what the script gives
        working-directory: tools/plan
        run: python ${{ matrix.check }}

  # What a judged program, its build and a served web program can reach, tried from inside the
  # verifier's container: the judge runs as root in a container of the Python image, without network
  # and under caps, as the verifier does. The other six images are checked on the project's own
  # machine, where they are already built.
  # An ordinary run ends in less than half of the time limit. The rest is room for a run in which tests
  # fail: a failing test in a container waits out its own time limit before it reports.
  attacks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the judge's pinned packages
        working-directory: bench
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r images/judge/requirements.txt
      - name: Build the Python language image
        working-directory: bench/images
        run: docker build --quiet -f python/Dockerfile -t dodam-bench/python:dev .
      # Inside the frame through which every container is started, as on the project's own machine: here without
      # that machine's readings, which the frame makes on macOS only.
      - name: Run the tests that judge inside the image
        working-directory: bench
        run: python -m dodambench.frame run -- python -m pytest -q -p no:cacheprovider -rs tests/test_cli_isolation.py tests/test_web_isolation.py tests/test_vet.py tests/test_cli_runtimes.py

  # Every protection of the judging is broken in turn, in a copy; a test must then fail. A
  # protection that can be removed without a test noticing fails this job.
  # An ordinary run ends in less than half of the time limit. The rest is room for a run in which a
  # broken variant makes a container wait out the time limit its test sets.
  protections:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the judge's pinned packages
        working-directory: bench
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r images/judge/requirements.txt
      - name: Build the Python language image
        working-directory: bench/images
        run: docker build --quiet -f python/Dockerfile -t dodam-bench/python:dev .
      - name: Break each protection and see a test fail
        working-directory: bench
        run: python -m dodambench.frame run -- python experiments/check_protections.py

  # Every test of the judge, of the vetting tool, of the formats of tasks and of the two converters that
  # needs no image is run once with nothing taken out, and then against each second line of the protections
  # in turn, in eight processes at once and the ones that need many readings within a fraction of a second
  # on their own: a second line one of them catches is no second line. The job fails where a test fails
  # with nothing taken out, where the tests cannot all be listed, or where a run ends otherwise than passed
  # or failed. An ordinary run ends in less than half of the time limit.
  second-lines:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the judge's pinned packages
        working-directory: bench
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r images/judge/requirements.txt
      - name: Take out each second line and run every test of the judge and of the vetting tool
        working-directory: bench
        run: python experiments/check_protections.py --second-lines
