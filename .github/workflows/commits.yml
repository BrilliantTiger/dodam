# Every commit that a push to a branch brings, and every commit and the text of a pull request from the project's
# own branches: the properties at the top of .github/commit-check/check.py. It runs the branch's own copy of the
# check, with the private pattern: a push from one of the project's branches runs that branch's workflows with the
# repository's secrets anyway, so judging the branch by its own copy opens nothing new, and a broken copy of the
# check's script on main cannot block the pull request that mends it. A branch or a pull request that does not change
# the check or its two workflows is judged by main's copy instead, as main is when the run starts, so that a rule main
# gained since the branch was made holds for it before its merge; one that changes them must have main's newest commit
# among its ancestors. A pull request from a fork is judged by main's copy in the workflow "pull-requests"; here it
# only runs the check's own tests. Tags are outside the check.
#
# The owner's gate refuses a head on which any run ended otherwise than in success, so no run here is cancelled
# (there is no concurrency group) and nothing is read again; the only waits are between the tries at GitHub's API,
# within one budget. A run fails on a commit, a text or a path that breaks a rule, and otherwise only with one of the
# check's fixed messages: the way for forks not open or its environment without a reviewer; GitHub's API did not
# answer; git could not read the history; a difference, a list of paths, a commit, the event, the settings or the list
# of signed commits cannot be read; the exempt commit missing; the merge not clean with main's tip; no commit to check;
# the secret expected and missing, in a form the copy can never meet, or no regular expression; the settings loosened;
# the fork's secret at the repository's level; the way open without its date or reviewer; a change of the check
# without main among its ancestors; the check's own tests failing; outputs that cannot be written; a call not as the
# workflows make it; or something the check does not know. The way back after a text is mended is a new head:
# on a branch of the project an empty commit whose message says why. A pull request's run has git build the merge
# GitHub will make of main's tip, as it is when the run starts, with the head, and judges that merge commit (its
# author's name, its message, its paths and lines) and the range to it as main's push will. The runs of a branch, once
# the way for forks is open, ask what main's push asks; the fork's secret is passed only as whether it is set, never
# its value. On main the range starts at the push's "before", so it is never empty; there the check detects and does
# not prevent, and a red main stops the next merge at the owner's gate.
#
# Reading whether the environment of forks waits for a reviewer needs no permission beyond contents in this public
# repository (measured on the side branch: the token of contents only reads an environment). It needs no package; in
# the records its job takes under two minutes of its limit of five.
name: commits

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  commits:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The check's own tests
        run: python3 -I .github/commit-check/run_tests.py
      - name: Check the commits of a push to a branch other than main, and the branch's name
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        env:
          BRANCH: ${{ github.ref_name }}
          AFTER: ${{ github.sha }}
          COMMIT_CHECK_PRIVATE_PATTERN: ${{ secrets.COMMIT_CHECK_PRIVATE_PATTERN }}
          FORK_SECRET_AT_REPOSITORY_LEVEL: ${{ secrets.FORK_CHECK_PRIVATE_PATTERN != '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          check=.github/commit-check
          if git diff --quiet origin/main..."$AFTER" -- .github/commit-check .github/workflows/commits.yml \
              .github/workflows/pull-requests.yml; then
            mkdir -p "$RUNNER_TEMP/base"
            git archive origin/main .github/commit-check | tar -x -C "$RUNNER_TEMP/base"
            check="$RUNNER_TEMP/base/.github/commit-check"
          elif ! git merge-base --is-ancestor origin/main "$AFTER"; then
            echo "::error::This branch changes the commit check: take main in first, so that main's newest commit is among its ancestors."
            exit 1
          fi
          python3 -I "$check/check.py" --repo . --from origin/main --head "$AFTER" --branch "$BRANCH" \
            --check-fork-way --settings "$check/settings.json" --context own --compare-settings origin/main
      - name: Check the commits of a push to main, and what the way for forks needs when it is open
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          COMMIT_CHECK_PRIVATE_PATTERN: ${{ secrets.COMMIT_CHECK_PRIVATE_PATTERN }}
          FORK_SECRET_AT_REPOSITORY_LEVEL: ${{ secrets.FORK_CHECK_PRIVATE_PATTERN != '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -I .github/commit-check/check.py --repo . --from "$BEFORE" --head "$AFTER" --require-commits \
            --check-fork-way --settings .github/commit-check/settings.json --context own --compare-settings "$BEFORE"
      - name: Check the commits and the text of a pull request from the project's own branches
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.id == github.repository_id
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMIT_CHECK_PRIVATE_PATTERN: ${{ secrets.COMMIT_CHECK_PRIVATE_PATTERN }}
          FORK_SECRET_AT_REPOSITORY_LEVEL: ${{ secrets.FORK_CHECK_PRIVATE_PATTERN != '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          main=$(git rev-parse --verify origin/main)
          check=.github/commit-check
          if git diff --quiet "$main"..."$HEAD_SHA" -- .github/commit-check .github/workflows/commits.yml \
              .github/workflows/pull-requests.yml; then
            mkdir -p "$RUNNER_TEMP/base"
            git archive "$main" .github/commit-check | tar -x -C "$RUNNER_TEMP/base"
            check="$RUNNER_TEMP/base/.github/commit-check"
          elif ! git merge-base --is-ancestor "$main" "$HEAD_SHA"; then
            echo "::error::This pull request changes the commit check: take main in first, so that main's newest commit is among its ancestors."
            exit 1
          fi
          python3 -I "$check/check.py" --repo . --from "$main" --head "$HEAD_SHA" --event "$GITHUB_EVENT_PATH" \
            --build-merge --check-fork-way --settings "$check/settings.json" --context own --compare-settings "$main"
