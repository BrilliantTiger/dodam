# Every commit that a push brings, and every commit and the text of a pull request from the project's own
# branches: the properties at the top of .github/commit-check/check.py. It runs the branch's own copy of
# the check, with the private pattern: a push from one of the project's branches runs that branch's
# workflows with the repository's secrets anyway, so judging the branch by its own copy opens nothing new,
# and a broken copy on main cannot block the pull request that mends it. A pull request from a fork is
# judged by main's copy in the workflow "pull-requests"; here it only runs the check's own tests.
#
# On a branch the push range is every commit not yet on main; on main it is the range from the push's
# "before", so it is never empty there. A merge commit is made at the moment of merging and is not part of
# the pull request, so on main this detects and does not prevent: a red main stops the next merge at the
# owner's gate. The way back is written in .github/commit-check/README.md.
#
# The owner's gate refuses a head on which any run ended otherwise than in success, so no run here is cancelled
# (there is no concurrency group) and none fails on what can still be mended on its head: when the title or the
# description of a pull request breaks a rule, the run waits up to 15 minutes, reading them again, and ends in
# success once they are mended; a waiting run is not finished, and the gate refuses that too.
#
# It needs no package and ends in well under a minute when nothing waits.
name: commits

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  commits:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The check's own tests
        run: python3 -I -m unittest discover -s .github/commit-check
      - name: Check the commits of the push
        if: github.event_name == 'push'
        env:
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          COMMIT_CHECK_PRIVATE_PATTERN: ${{ secrets.COMMIT_CHECK_PRIVATE_PATTERN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$REF" = refs/heads/main ]; then
            python3 -I .github/commit-check/check.py --repo . --from "$BEFORE" --head "$AFTER" \
              --settings .github/commit-check/settings.json --context own --require-commits \
              --compare-settings "$BEFORE"
          else
            python3 -I .github/commit-check/check.py --repo . --from origin/main --head "$AFTER" \
              --settings .github/commit-check/settings.json --context own --compare-settings origin/main
          fi
      - name: Check the commits and the text of the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.id == github.repository_id
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMIT_CHECK_PRIVATE_PATTERN: ${{ secrets.COMMIT_CHECK_PRIVATE_PATTERN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -I .github/commit-check/check.py --repo . --from "$BASE_SHA" --head "$HEAD_SHA" \
            --settings .github/commit-check/settings.json --context own --event "$GITHUB_EVENT_PATH" \
            --compare-settings "$BASE_SHA" --wait-for-text 900 --poll 15
