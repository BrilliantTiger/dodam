# Builds the introduction page and publishes it to GitHub Pages.
#
# - Every push to main builds and deploys the page, whatever the push touched.
# - Every hour the page is built again on main, and deployed only when what it would show differs from
#   what is published (the number of open issues, or the step the calendar has reached).
#
# It runs for main only: a pull request, from this repository or from outside, deploys nothing. It uses
# no stored secret. The build job reads the repository and counts open issues with the token GitHub
# gives every run; only the deploy job may publish, and it gets nothing beyond that.
name: pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      changed: ${{ steps.page.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # the latest merged changes are read from the history
      - name: Build the page with the values of now
        id: page
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I tools/site/build.py --live "$RUNNER_TEMP/site" --compare >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'push' || steps.page.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || needs.build.outputs.changed == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
