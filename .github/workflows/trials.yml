# Trial (a) of the kernel-ends tests on 5b20f44 in four jobs of ten, to land on the kind of runner (Azure) on which a
# run failed in run 46119403830 without its record; each run has its own temporary base; on a side branch only.
name: trials
on: push
permissions:
  contents: read
env:
  MENDED: 5b20f4487e0b9144c67bc8b54b82c3f73fd01999
  BOTH: >-
    tests/test_cli_isolation.py::test_a_program_the_kernel_ends_fails_its_case_and_the_others_are_judged
    tests/test_cli_isolation.py::test_a_case_runner_the_kernel_ends_costs_only_the_case_that_was_running
jobs:
  # (a) both tests, 10 times in a row in each of 4 jobs, until one job lands on Azure with its record
  both:
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.MENDED }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - working-directory: bench
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r images/judge/requirements.txt
      - working-directory: bench/images
        run: docker build --quiet -f python/Dockerfile -t dodam-bench/python:dev .
      - name: 20 runs
        working-directory: bench
        run: |
          mkdir -p ../said
          # every run is recorded, and the step fails only after all ten and their numbers are printed
          for r in $(seq 1 10); do python -m pytest -q -p no:cacheprovider -rs --tb=short --basetemp=../base-$r $BOTH > ../said/$r.txt 2>&1 || true; done
          echo "every round whose summary is not a plain pass, whole:"
          for f in ../said/*.txt; do grep -qxE "3 passed in [0-9.]+s( \(.*\))?" "$f" || { echo "--- $f"; cat "$f"; }; done
          echo "summaries:"; cat ../said/*.txt | grep -E "^[0-9]+ (passed|failed|skipped)" | sed 's/ in .*//' | sort | uniq -c
          echo "failed, by test:"; cat ../said/*.txt | grep "^FAILED" | sed 's/ - .*//' | sort | uniq -c
          echo "what failed said:"; cat ../said/*.txt | grep -E "^E |^/.*Error" | cut -c1-600 | sort | uniq -c | head -60
          for r in $(seq 1 10); do grep -qE "[0-9]+ failed" ../said/$r.txt && { echo "--- run $r, in full:"; tail -80 ../said/$r.txt; }; done
          echo "times of the mended form:"; grep -hE "^[0-9]+ passed.* in " ../said/*.txt | sed -E 's/.* in ([0-9.]+)s.*/\1/' | sort -n | tr '\n' ' '; echo
          echo "every turn's numbers:"; cat ../said/*.txt | grep -E "^the watcher, " | sort | uniq -c | sort -rn | head -60
          ! grep -qE "failed|skipped" ../said/*.txt
