# Only on the side branch commit-check-breaks-7: the check broken by machine, every break against its tests. The other
# workflows are not on this branch; the check's two workflows stand beside it in .github/breaks-workflows, where they run
# nothing, for the tests that read their text. Each share keeps its report as an artifact, whatever its end.
name: breaks

on:
  push:
    branches: [commit-check-breaks-7]

permissions:
  contents: read

jobs:
  breaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/10", "2/10", "3/10", "4/10", "5/10", "6/10", "7/10", "8/10", "9/10", "10/10"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Break the check and run its tests against every break
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python3 -I .github/commit-check/break_check.py --shard "$SHARD" --workers 4 --report "$RUNNER_TEMP/breaks.json" \
            --workflows .github/breaks-workflows
      - name: Keep the share's report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: breaks-${{ strategy.job-index }}
          path: ${{ runner.temp }}/breaks.json
          if-no-files-found: error
