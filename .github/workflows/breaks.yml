# Breaks one statement of the judge's code in each job and runs the tests the job of the second lines runs.
# It lives on a branch of its own that is never merged, and the branch is removed once its results are
# written down. A job fails where a test fails: the break is caught. See breaks/run.py.
name: breaks

on:
  push:
    branches: [judge-memory-breaks]

permissions:
  contents: read

# one run at a time, so that no more jobs run at once than the matrix allows
concurrency:
  group: breaks
  cancel-in-progress: false

jobs:
  keys:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      keys: ${{ steps.keys.outputs.keys }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: keys
        run: python3 breaks/run.py keys >> "$GITHUB_OUTPUT"

  break:
    needs: keys
    name: ${{ matrix.key }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        key: ${{ fromJSON(needs.keys.outputs.keys) }}
    env:
      KEY: ${{ matrix.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: side
      - id: tree
        run: python3 side/breaks/run.py ref "$KEY" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.tree.outputs.ref }}
          path: repo
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the judge's pinned packages
        working-directory: repo/bench
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r images/judge/requirements.txt
      - name: List the tests with nothing broken
        run: python side/breaks/run.py list "$KEY" repo
      - name: Break the statement
        run: python side/breaks/run.py break "$KEY" repo
      - name: Run the tests
        run: python side/breaks/run.py test "$KEY" repo
