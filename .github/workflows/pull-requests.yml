# The gate on every pull request from a fork. It runs main's copy of this file and of its scripts
# (pull_request_target), so a pull request from outside cannot change what checks it. A pull request from
# the project's own branches runs no code here: the workflow "commits" judges it with its branch's own copy,
# so that a broken copy on main cannot block the pull request that mends it. Because this workflow holds the
# repository's token and could read secrets for a pull request from a fork:
# - nothing from the pull request is executed or imported: the checkout is main's, the pull request's
#   commits are fetched into a ref and read as data, nothing is installed, and git is told to use no diff
#   program and no text conversion;
# - the permissions are read-only and written out;
# - no value of the event goes into a shell line through the expression syntax, only through env;
# - every action is pinned by its commit;
# - the job that judges a fork's pull request runs in the environment private-check, which holds the secret and
#   waits for the project's account to approve each run; until then the run is not finished and uses no runner.
# The owner's gate refuses a head on which any run ended otherwise than in success, so nothing here is cancelled
# and nothing fails but a real fault: there is no concurrency group, and the judgement is given at once.
# The tests in .github/commit-check/test_workflows.py read this file and fail when one of these is broken.
# More jobs of the gate belong in this file, beside the ones below.
name: pull-requests

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  # A pull request from the project's own branches: judged by the job commits of the workflow commits.
  pull-request-own:
    if: github.event.pull_request.head.repo.id == github.repository_id
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: A pull request from the project's own branches is judged by its branch's own copy
        run: echo "This pull request comes from a branch of the project; the job commits of the workflow commits judges it with that branch's own copy of the check."

  # A pull request from a fork: every commit after the exempt commit, its title, description and branch name,
  # with the private pattern; see the top of .github/commit-check/check.py. It waits for the project's approval,
  # which the project's account gives after both reviews, for every waiting run of the head at once.
  # Once approved it ends in well under a minute.
  pull-request-commits:
    if: github.event.pull_request.head.repo.id != github.repository_id
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: private-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch the pull request's commits as data
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$HEAD_SHA" in *[!0-9a-f]*|'') echo "::error::no head commit"; exit 1;; esac
          git fetch --no-tags --quiet origin "+$HEAD_SHA:refs/remotes/pull/head"
      - name: The check's own tests
        run: python3 -I -m unittest discover -s .github/commit-check
      - name: Check the commits and the text
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMIT_CHECK_PRIVATE_PATTERN: ${{ secrets.COMMIT_CHECK_PRIVATE_PATTERN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -I .github/commit-check/check.py --repo . --from "$BASE_SHA" --head "$HEAD_SHA" \
            --settings .github/commit-check/settings.json --context fork-approved --event "$GITHUB_EVENT_PATH"
